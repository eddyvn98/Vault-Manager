[package]
name = "vault-manager"
version = "0.1.0"
description = "Local-only experimental BTC and BSC wallet foundation"
authors = ["Vault Manager Contributors"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "vault_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bip39 = { version = "2.2", features = ["rand"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
base64 = "0.22"
zeroize = "1.8"
bitcoin = { version = "0.32", default-features = false, features = ["std", "rand-std"] }
bdk_wallet = { version = "3.2.0", default-features = false, features = ["std"] }
bdk_esplora = { version = "0.22.3", default-features = false, features = ["std", "async-https-rustls", "tokio"] }
tiny-keccak = { version = "2.0", features = ["keccak"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
num-bigint = "0.4"
num-traits = "0.2"
hex = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
